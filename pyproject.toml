[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bombista"
version = "1.0.1"
description = "Forced-alignment triage for lyric and subtitle timelines"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jorge Vallejos" }]
keywords = ["forced-alignment", "subtitles", "captions", "surtitles", "lyrics", "timeline", "whisper", "srt", "lrc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "click>=8.1",
    "faster-whisper>=1.0",
]

[project.urls]
Homepage = "https://changopepper.com/tramoya/bombista"
Source = "https://github.com/jorgevallejos/bombista"
Issues = "https://github.com/jorgevallejos/bombista/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
bombista = "bombista.cli:main"

[tool.setuptools]
packages = ["bombista"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises real external dependencies (e.g. the faster-whisper model); slower but runs by default",
    "canary: the pimiento acceptance run (B20 §7). Opt-in — it reads the private vault through BOMBISTA_CANARY_SONG and BOMBISTA_CANARY_STAGING, and skips with those names in the message when they are unset. No song lyrics, no real ASR stream and no audio are committed here (§11.3)",
]
