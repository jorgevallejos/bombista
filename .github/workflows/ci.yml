name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, and the version the tool is
        # actually developed against.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The integration test runs the tiny Whisper model against a committed
      # 12 s fixture, so the first run on a cold cache downloads it. Keyed on
      # the model name rather than the lockfile, since that is what decides
      # what lands here.
      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-${{ runner.os }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      # Catches the failure mode the __main__ guard exists to prevent: a
      # module that imports cleanly, exits 0, and prints nothing.
      - name: Both entry points respond
        run: |
          bombista --help > /dev/null
          python -m bombista.cli --help > /dev/null
