[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bombista"
version = "0.9.0"
description = "Forced-alignment triage for lyric and subtitle timelines"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jorge Vallejos" }]
keywords = ["forced-alignment", "subtitles", "captions", "surtitles", "lyrics", "timeline", "whisper", "srt", "lrc"]
dependencies = [
    "click>=8.1",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
bombista = "bombista.cli:main"

[tool.setuptools]
packages = ["bombista"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises real external dependencies (e.g. the faster-whisper model); slower but runs by default",
]
