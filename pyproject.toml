[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline-extractor"
version = "0.1.0"
description = "Derive a lyric/subtitle timeline from a lyrics-only video"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
timeline-extractor = "timeline_extractor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
